<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient matching Indigo-600 to Blue-600 theme -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#4338CA" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- Subtle Inner Top Highlight -->
    <linearGradient id="highlightGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Soft Depth Shadow -->
    <filter id="capShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1E1B4B" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Premium Squircle Container (matches App & Login branding) -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#bgGrad)" />
  
  <!-- Subtle Top Light Reflection -->
  <rect x="16" y="16" width="480" height="240" rx="120" fill="url(#highlightGrad)" />

  <!-- Graduation Cap Icon (Lucide GraduationCap Geometry scaled & styled to 512px) -->
  <g filter="url(#capShadow)" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main Diamond Mortarboard Top -->
    <polygon 
      points="256,120 440,212 256,304 72,212" 
      fill="#FFFFFF" 
      stroke="#FFFFFF" 
      stroke-width="12" 
    />
    
    <!-- Skullcap Base -->
    <path 
      d="M136,244 L136,336 C180,388 332,388 376,336 L376,244" 
      fill="none" 
      stroke="#FFFFFF" 
      stroke-width="32" 
      stroke-linecap="round" 
    />

    <!-- Tassel String and Hanging Knot -->
    <path 
      d="M440,212 L440,344" 
      fill="none" 
      stroke="#FFFFFF" 
      stroke-width="24" 
      stroke-linecap="round" 
    />
    <circle cx="440" cy="356" r="14" fill="#FFFFFF" />
  </g>
</svg>
