<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Always Look Up</title>
    <meta name="description" content="Uppseekers Student &amp; Team Portal - Always Look Up" />
    <meta property="og:title" content="Always Look Up" />
    <meta property="og:description" content="Uppseekers Student &amp; Team Portal - Always Look Up" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Gracefully prevent benign Vite HMR websocket reconnection noise from surfacing as Unhandled Rejections
      window.addEventListener('unhandledrejection', function (event) {
        var reason = event.reason;
        var msg = (reason && (reason.message || reason.stack || String(reason))) || '';
        if (
          msg.includes('WebSocket') || 
          msg.includes('websocket') || 
          msg.includes('closed without opened') || 
          msg.includes('[vite]')
        ) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      }, true);

      window.addEventListener('error', function (event) {
        var msg = (event && (event.message || event.error && event.error.message || '')) || '';
        if (
          msg.includes('WebSocket') || 
          msg.includes('websocket') || 
          msg.includes('closed without opened') || 
          msg.includes('[vite]')
        ) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      }, true);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
