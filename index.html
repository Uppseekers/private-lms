<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Always Look Up</title>
    <meta name="description" content="Uppseekers Student &amp; Team Portal - Always Look Up" />
    <meta property="og:title" content="Always Look Up" />
    <meta property="og:description" content="Uppseekers Student &amp; Team Portal - Always Look Up" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      (function() {
        // 1. Intercept Vite HMR WebSocket connection to prevent "WebSocket closed without opened"
        var OriginalWebSocket = window.WebSocket;
        if (OriginalWebSocket) {
          window.WebSocket = function(url, protocols) {
            var isViteHmr = protocols === 'vite-hmr' || 
              (typeof url === 'string' && (url.includes('vite-hmr') || url.includes('/@vite/') || url.includes('__vite_plugin_react_preamble')));
            if (isViteHmr) {
              var listeners = {};
              var mockSocket = {
                readyState: 1, // WebSocket.OPEN
                url: url,
                protocol: protocols || 'vite-hmr',
                bufferedAmount: 0,
                extensions: '',
                binaryType: 'blob',
                send: function() {},
                close: function() { mockSocket.readyState = 3; },
                addEventListener: function(type, fn) {
                  listeners[type] = listeners[type] || [];
                  listeners[type].push(fn);
                },
                removeEventListener: function(type, fn) {
                  if (listeners[type]) {
                    listeners[type] = listeners[type].filter(function(cb) { return cb !== fn; });
                  }
                },
                dispatchEvent: function() { return true; },
                onopen: null,
                onclose: null,
                onerror: null,
                onmessage: null
              };
              return mockSocket;
            }
            return new OriginalWebSocket(url, protocols);
          };
          window.WebSocket.prototype = OriginalWebSocket.prototype;
          window.WebSocket.CONNECTING = OriginalWebSocket.CONNECTING || 0;
          window.WebSocket.OPEN = OriginalWebSocket.OPEN || 1;
          window.WebSocket.CLOSING = OriginalWebSocket.CLOSING || 2;
          window.WebSocket.CLOSED = OriginalWebSocket.CLOSED || 3;
        }

        // 2. Suppress console error & warn noise from Vite HMR websocket
        var origConsoleError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          var str = args.map(function(a) { 
            return (a && (a.message || a.stack || String(a))) || ''; 
          }).join(' ');
          if (
            str.includes('[vite]') || 
            str.includes('WebSocket') || 
            str.includes('websocket') || 
            str.includes('closed without opened')
          ) {
            return;
          }
          origConsoleError.apply(console, args);
        };

        var origConsoleWarn = console.warn;
        console.warn = function() {
          var args = Array.prototype.slice.call(arguments);
          var str = args.map(function(a) { 
            return (a && (a.message || a.stack || String(a))) || ''; 
          }).join(' ');
          if (
            str.includes('[vite]') || 
            str.includes('WebSocket') || 
            str.includes('websocket') || 
            str.includes('closed without opened')
          ) {
            return;
          }
          origConsoleWarn.apply(console, args);
        };

        // 3. Prevent unhandled rejections & window errors
        window.addEventListener('unhandledrejection', function (event) {
          var reason = event.reason;
          var msg = (reason && (reason.message || reason.stack || String(reason))) || '';
          if (
            msg.includes('WebSocket') || 
            msg.includes('websocket') || 
            msg.includes('closed without opened') || 
            msg.includes('[vite]')
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('error', function (event) {
          var msg = (event && (event.message || event.error && event.error.message || '')) || '';
          if (
            msg.includes('WebSocket') || 
            msg.includes('websocket') || 
            msg.includes('closed without opened') || 
            msg.includes('[vite]')
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
